# netlify.toml
# Registra a Edge Function de bloqueio geografico.
# A funcao roda em todas as rotas e bloqueia visitantes fora da America Latina.

[[edge_functions]]
  path = "/*"
  function = "geo-block"

[functions]
  included_files = ["protected/tracking-template.html"]

[[headers]]
  for = "/acompanhar/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
