name: Cloudflare

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate public bundle and Worker
        run: npm run check

      - name: Verify deployment secrets
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRACKING_390344_CONFIG: ${{ secrets.TRACKING_390344_CONFIG }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$TRACKING_390344_CONFIG" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e TRACKING_390344_CONFIG nos segredos do repositório."
            exit 1
          fi

      - name: Deploy Worker
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy
          secrets: |
            TRACKING_390344_CONFIG
        env:
          TRACKING_390344_CONFIG: ${{ secrets.TRACKING_390344_CONFIG }}
